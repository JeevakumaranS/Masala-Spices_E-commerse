version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: masala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: masala_db
      POSTGRES_USER: masala
      POSTGRES_PASSWORD: masala123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: masala-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://masala:masala123@db:5432/masala_db
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    container_name: masala-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
