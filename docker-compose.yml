services:
  db:
    image: postgres:18-alpine
    container_name: masala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in the root .env}:5432"
    volumes:
      - postgres_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masala -d masala_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: masala-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env}
      RUSTFS_ENDPOINT: ${RUSTFS_CONTAINER_ENDPOINT:?Set RUSTFS_CONTAINER_ENDPOINT in the root .env}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:?Set RUSTFS_PUBLIC_ENDPOINT in the root .env}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in the root .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in the root .env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?Set RUSTFS_BUCKET in the root .env}
      RUSTFS_LEGACY_BUCKET: ${RUSTFS_LEGACY_BUCKET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_HOST_PORT:?Set BACKEND_HOST_PORT in the root .env}:8000"

  frontend:
    container_name: masala-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in the root .env}
        NEXT_PUBLIC_RUSTFS_PUBLIC_ENDPOINT: ${NEXT_PUBLIC_RUSTFS_PUBLIC_ENDPOINT:?Set NEXT_PUBLIC_RUSTFS_PUBLIC_ENDPOINT in the root .env}
        RUSTFS_BUCKET: ${RUSTFS_BUCKET:?Set RUSTFS_BUCKET in the root .env}
        RUSTFS_LEGACY_BUCKET: ${RUSTFS_LEGACY_BUCKET:-}
    restart: unless-stopped
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:?Set BACKEND_API_URL in the root .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in the root .env}
      NEXT_PUBLIC_RUSTFS_PUBLIC_ENDPOINT: ${NEXT_PUBLIC_RUSTFS_PUBLIC_ENDPOINT:?Set NEXT_PUBLIC_RUSTFS_PUBLIC_ENDPOINT in the root .env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?Set RUSTFS_BUCKET in the root .env}
      RUSTFS_LEGACY_BUCKET: ${RUSTFS_LEGACY_BUCKET:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:?Set FRONTEND_HOST_PORT in the root .env}:3000"

volumes:
  postgres_data_pg18:
