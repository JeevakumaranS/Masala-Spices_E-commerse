services:
  db:
    image: postgres:18-alpine
    container_name: masala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: masala_db
      POSTGRES_USER: masala
      POSTGRES_PASSWORD: masala123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masala -d masala_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: masala-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://masala:masala123@db:5432/masala_db
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python scripts/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    container_name: masala-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data_pg18:
