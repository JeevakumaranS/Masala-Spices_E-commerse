services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "${RUSTFS_HOST_PORT:?Set RUSTFS_HOST_PORT in the root .env}:${RUSTFS_CONTAINER_PORT:?Set RUSTFS_CONTAINER_PORT in the root .env}"
      - "${RUSTFS_CONSOLE_HOST_PORT:?Set RUSTFS_CONSOLE_HOST_PORT in the root .env}:${RUSTFS_CONSOLE_PORT:?Set RUSTFS_CONSOLE_PORT in the root .env}"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in the root .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in the root .env}
    command: --address :${RUSTFS_CONTAINER_PORT:?Set RUSTFS_CONTAINER_PORT in the root .env} --console-address :${RUSTFS_CONSOLE_PORT:?Set RUSTFS_CONSOLE_PORT in the root .env}

volumes:
  rustfs_data:
