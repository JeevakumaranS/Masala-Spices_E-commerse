services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: rustfs-password
    command: --address :9000 --console-address :9001

volumes:
  rustfs_data:
